apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ems-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: ashishujjwal/authservice:latest
        envFrom:
        - configMapRef:
            name: ems-config
        - secretRef:
            name: ems-secret
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-server:3306/auth_db?createDatabaseIfNotExist=true"
        ports:
        - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ems-prod
spec:
  selector:
    app: auth-service
  ports:
    - port: 8083
      targetPort: 8083
