apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: ems-prod
spec:
  replicas: 0 # Eureka is disabled, kept for learning purposes
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka-server
        # Make sure this matches your Docker Hub username if it is not ashishujjwal
        image: ashishujjwal/eurekaserver:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ems-config
        env:
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "eureka-server"
        - name: SERVER_ADDRESS
          value: "0.0.0.0"
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: ems-prod
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
      nodePort: 30001
  type: NodePort
