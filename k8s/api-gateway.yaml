apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ems-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ashishujjwal/apigateway:latest
        envFrom:
        - configMapRef:
            name: ems-config
        resources:
          requests:
            cpu: "50m"      # Very low CPU request (1/20th of a core)
            memory: "256Mi" # Minimum needed for your Spring Boot Java app
          limits:
            cpu: "200m"     # Max 1/5th of a core
            memory: "384Mi" # Max memory cap to protect your local PC
        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ems-prod
spec:
  selector:
    app: api-gateway
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30002
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: ems-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 9090
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler  
metadata:
  name: api-gateway-autoscaler
  namespace: ems-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
